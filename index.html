<script>
const BLUE='#1A56DB',YELLOW='#FBBF24',PURPLE='#7C3AED',PLOT={responsive:true,displaylogo:false,displayModeBar:false,scrollZoom:false};
const fmtInt=v=>Number(v).toLocaleString('es-CL',{maximumFractionDigits:0});
const fmtUsd=v=>'USD '+Number(v).toLocaleString('es-CL',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtPct=v=>Number(v).toLocaleString('es-CL',{minimumFractionDigits:2,maximumFractionDigits:2})+'%';
const rec=(data,name)=>data.datasets[name].records;
const metric=(label,value,note='',tone='activity',compact=false)=>`<article class="metric ${tone}${compact?' compact':''}"><dl><dt>${label}</dt><dd>${value}</dd></dl><small>${note}</small></article>`;
const hero=(title,copy)=>`<section class="hero"><div class="hero-copy"><div class="kicker">MASTERPLOP · ANALYTICS</div><h1>${title}</h1><p>${copy}</p><div class="chips"><span class="chip">Datos al 30 jun 2024</span><span class="chip">Montos netos en USD</span><span class="chip">Agregado · Sin IDs</span></div></div><aside class="hero-score"><span>DATA QUALITY</span><strong>48 / 48</strong><small>● Conciliado</small></aside></section>`;
const sectionHead=(title,copy,tag='ANÁLISIS')=>`<div class="section-head"><div><h2>${title}</h2><p>${copy}</p></div><span class="section-tag">${tag}</span></div>`;
const chartCard=(id,title,kicker='VISUAL INTERACTIVO')=>`<article class="viz-card"><div class="viz-head"><div><span>${kicker}</span><h3>${title}</h3></div><span class="viz-badge">Interactivo</span></div><div id="${id}" class="plot" role="img" aria-label="${title}"></div><details class="data-details"><summary>Ver datos en tabla</summary><div id="${id}Table" class="data-table"></div></details></article>`;
const insight=(kicker,value,copy)=>`<article class="insight"><span>${kicker}</span><strong>${value}</strong><p>${copy}</p></article>`;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const renderTable=(id,columns,rows)=>{const target=document.getElementById(`${id}Table`);if(!target)return;target.innerHTML=`<table><thead><tr>${columns.map(c=>`<th scope="col">${esc(c.label)}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${columns.map(c=>`<td>${esc(typeof c.value==='function'?c.value(row):row[c.value])}</td>`).join('')}</tr>`).join('')}</tbody></table>`};
const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)');
let revealObserver=null;
const setupMotion=()=>{const nodes=[...document.querySelectorAll('.hero,.metric,.section-head,.insight,.process-step,.viz-card,.notice')];nodes.forEach(x=>x.classList.add('reveal'));document.body.classList.add('motion-ready');if(reducedMotion.matches||!('IntersectionObserver' in window)){nodes.forEach(x=>x.classList.add('is-visible'));return}revealObserver=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('is-visible');revealObserver.unobserve(entry.target)}}),{threshold:.08,rootMargin:'0px 0px -7% 0px'});nodes.forEach(x=>revealObserver.observe(x))};
const revealActivePage=page=>{if(!page)return;page.querySelectorAll('.reveal:not(.is-visible)').forEach(x=>{if(reducedMotion.matches||!revealObserver)x.classList.add('is-visible');else revealObserver.observe(x)})};
const setupScrollProgress=()=>{const bar=document.getElementById('scrollProgress');if(!bar)return;let ticking=false;const update=()=>{const max=document.documentElement.scrollHeight-innerHeight;bar.style.width=`${max>0?Math.min(100,Math.max(0,scrollY/max*100)):0}%`;ticking=false};const request=()=>{if(!ticking){ticking=true;requestAnimationFrame(update)}};addEventListener('scroll',request,{passive:true});addEventListener('resize',request,{passive:true});update()};
const setupHeroSpotlight=()=>{if(reducedMotion.matches||!matchMedia('(pointer:fine)').matches)return;document.querySelectorAll('.hero').forEach(hero=>{hero.addEventListener('pointermove',event=>{const box=hero.getBoundingClientRect();hero.style.setProperty('--spot-x',`${(event.clientX-box.left)/box.width*100}%`);hero.style.setProperty('--spot-y',`${(event.clientY-box.top)/box.height*100}%`)});hero.addEventListener('pointerleave',()=>{hero.style.setProperty('--spot-x','78%');hero.style.setProperty('--spot-y','25%')})})};
const plotLayout=(title,{horizontal=false,height=430,xSuffix='',yPrefix='',showLegend=true,xRange=null}={})=>{const mobile=window.innerWidth<700;const hasTitle=Boolean(title);const resolvedHeight=mobile&&horizontal&&height>580?620:(mobile&&horizontal&&height>500?520:(mobile?Math.min(height,390):height));return {height:resolvedHeight,title:{text:title,x:.02,xanchor:'left',y:.97,font:{size:mobile?15:17}},paper_bgcolor:'rgba(0,0,0,0)',plot_bgcolor:'rgba(0,0,0,0)',font:{family:'Inter, Segoe UI, sans-serif',color:'#172033',size:mobile?10:12},separators:',.',margin:{l:horizontal?(mobile?145:210):(mobile?50:65),r:horizontal?(mobile?28:54):24,t:hasTitle?76:(showLegend?48:24),b:mobile?58:52},showlegend:showLegend,legend:{orientation:'h',x:1,xanchor:'right',y:1.03,yanchor:'bottom',font:{size:11}},hoverlabel:{bgcolor:'white',font:{color:'#172033'}},xaxis:{gridcolor:'#EEF1F6',zeroline:false,automargin:true,ticksuffix:xSuffix,range:xRange},yaxis:{gridcolor:'#EEF1F6',zeroline:false,automargin:true,tickprefix:yPrefix}}};
function shell(data){
 const e=rec(data,'executive')[0],cb=rec(data,'cashback')[0],sens=rec(data,'cashback_sensitivity')[0],wrong=rec(data,'cashback_is_xb')[0];
 const volume=rec(data,'volume'),ticket=rec(data,'quarterly_ticket'),top=rec(data,'top_mcg'),contact=rec(data,'contactless');
 const credit=volume.filter(x=>x.product_type==='Crédito').sort((a,b)=>a.period_quarter-b.period_quarter);
 const creditGrowth=(+credit[1].active_cards/+credit[0].active_cards-1)*100;
 const ticketGrowth=(+ticket[1].net_spend_per_active_card_usd/+ticket[0].net_spend_per_active_card_usd-1)*100;
 const top3Share=top.slice(0,3).reduce((sum,x)=>sum+(+x.net_spend_share_pct),0);
 const contactLeader=[...contact].sort((a,b)=>+b.contactless_net_spend_pct-(+a.contactless_net_spend_pct))[0];
 const cappedShare=+cb.capped_card_count/+cb.beneficiary_card_count*100;
 const xbCostGap=Math.abs(+wrong.difference_vs_official_usd)/+cb.total_cashback_usd*100;
 return `<section id="summary" class="page active" role="tabpanel" tabindex="0" aria-labelledby="tab-summary">${hero('Resumen Ejecutivo','Una lectura ejecutiva de actividad, gasto, adopción tecnológica y costo de campaña sobre datos financieros conciliados.')}
 <div class="metrics">${metric('Tarjetas activas',fmtInt(e.active_cards),'distintas','activity')}${metric('Transacciones',fmtInt(e.transaction_count),'enero–junio','activity')}${metric('Gasto neto',fmtUsd(e.total_net_spend_usd),'incluye ajustes','spend',true)}${metric('Ticket promedio',fmtUsd(e.avg_transaction_amount_usd),'por transacción','spend')}${metric('Cashback mayo',fmtUsd(e.total_cashback_usd),'costo oficial','campaign',true)}${metric('Tarjetas beneficiadas',fmtInt(e.beneficiary_card_count),'cashback positivo','campaign')}</div>
 ${sectionHead('Lectura ejecutiva','Señales de crecimiento, concentración del gasto y adopción tecnológica.','HALLAZGOS')}
 <div class="insight-grid">${insight('ACTIVIDAD CRÉDITO',`+${fmtPct(creditGrowth)}`,'Tarjetas activas T2 versus T1.')}${insight('TICKET CRÉDITO',`+${fmtPct(ticketGrowth)}`,'Aumento del gasto neto por tarjeta activa.')}${insight('CONCENTRACIÓN',fmtPct(top3Share),'Del gasto neto se concentra en los tres principales MCG.')}${insight('CONTACTLESS LÍDER',contactLeader.issuer_country,`${fmtPct(contactLeader.contactless_net_spend_pct)} del gasto neto.`)}</div>
 ${sectionHead('Drivers del negocio','Categorías de mayor peso y mercados con mayor uso contactless.','PORTAFOLIO')}
 <div class="grid2">${chartCard('summaryTop','Top 5 categorías por participación','GASTO NETO')}${chartCard('summaryContactless','Top 5 mercados contactless','ADOPCIÓN')}</div></section>
 <section id="transactions" class="page" role="tabpanel" tabindex="0" aria-labelledby="tab-transactions">${hero('Análisis Transaccional','Los cinco indicadores solicitados, separados por período real, mercado emisor, producto y categoría comercial.')}
 ${sectionHead('Actividad y monetización','Tarjetas distintas y gasto neto de crédito por período real.','PERÍODO')}
 <div class="grid2">${chartCard('volume','Tarjetas distintas por trimestre y tipo','VOLUMEN')}${chartCard('ticket','Ticket trimestral de crédito','GASTO POR TARJETA')}</div>
 ${sectionHead('Ticket regional','Promedio por transacción según país emisor y producto.','MERCADO EMISOR')}
 <div class="filters"><label for="countryFilter">País emisor<select id="countryFilter"></select></label><label for="productFilter">Producto<select id="productFilter"></select></label></div>${chartCard('regional','Ticket promedio regional','PROMEDIO POR TRANSACCIÓN')}
 ${sectionHead('Comercios y tecnología','Participación del gasto por categoría y adopción contactless.','COMPORTAMIENTO')}
 <div class="grid2">${chartCard('topMcg','Top 10 MCG por participación global','COMERCIOS')}${chartCard('contactless','Adopción contactless por país emisor','TECNOLOGÍA')}</div><p class="notice">El denominador del Top 10 es el gasto neto global e incluye el MCG 35 sin maestro como <strong>Sin clasificar</strong>. El indicador regional y contactless utilizan país emisor.</p></section>
 <section id="campaign" class="page" role="tabpanel" tabindex="0" aria-labelledby="tab-campaign">${hero('Campaña Mayo 2024','Crédito · emisor Chile · comercio fuera de Chile · 7% del gasto neto positivo · tope USD 50 por tarjeta.')}
 <div class="metrics">${metric('Costo total',fmtUsd(cb.total_cashback_usd),'redondeo por tarjeta','campaign',true)}${metric('Beneficiadas',fmtInt(cb.beneficiary_card_count),'cashback > 0','campaign')}${metric('Tarjetas topadas',fmtInt(cb.capped_card_count),'máximo USD 50','campaign')}${metric('Gasto elegible',fmtUsd(cb.net_eligible_spend_usd),'compras menos devoluciones','spend',true)}${metric('Transacciones elegibles',fmtInt(cb.eligible_transaction_count),'geografía real','activity')}${metric('Ahorro por tope',fmtUsd(cb.cap_savings_usd),'vs. cashback sin límite','spend',true)}</div>
 ${sectionHead('Cómo se calcula','La política se aplica de forma individual y monetariamente auditable.','REGLA OFICIAL')}
 <div class="process-grid"><article class="process-step"><b>1</b><strong>Elegibilidad</strong><span>Mayo, crédito, emisor Chile y comercio fuera de Chile.</span></article><article class="process-step"><b>2</b><strong>Gasto neto</strong><span>Compras y devoluciones se consolidan por tarjeta.</span></article><article class="process-step"><b>3</b><strong>Beneficio</strong><span>7% del saldo positivo, limitado a USD 50.</span></article><article class="process-step"><b>4</b><strong>Redondeo</strong><span>Dos decimales por tarjeta antes de sumar el costo.</span></article></div>
 <div class="insight-grid">${insight('BENEFICIADAS TOPADAS',fmtPct(cappedShare),'Recibieron el máximo individual de USD 50.')}${insight('EFECTO DEVOLUCIONES',fmtUsd(sens.incremental_cost_vs_net_usd),'Costo adicional si no se descuentan ajustes negativos.')}${insight('RIESGO DE FLAG',fmtPct(xbCostGap),'Subestimación del costo al usar is_xb como elegibilidad.')}${insight('AJUSTES ELEGIBLES',fmtInt(cb.negative_eligible_transaction_count),'Transacciones negativas incluidas en el neteo.')}</div>
 ${sectionHead('Conciliación financiera','Efecto del tope y diagnóstico del flag is_xb frente a la geografía real.','CONTROL')}
 <div class="grid2">${chartCard('campaignWaterfall','Del cashback sin tope al costo oficial','PUENTE DE COSTO')}${chartCard('campaignMatrix','Geografía real versus flag is_xb','MATRIZ DE CONCILIACIÓN')}</div><p class="notice quality"><strong>Decisión financiera:</strong> se agrupa primero por tarjeta, se descuentan devoluciones, se limita a USD 50 y se redondea individualmente antes de sumar. <code>is_xb</code> se conserva solo como diagnóstico.</p></section>
 <footer><strong>Definiciones:</strong> tarjetas activas = tarjetas distintas con transacción; ticket trimestral = gasto neto de crédito / tarjetas activas de crédito; ticket regional = promedio por transacción según país emisor; contactless = gasto contactless / gasto total. Montos en USD. Fuente: enero–junio 2024. · <a href="powerbi/Masterplop_Executive.pdf" target="_blank" rel="noopener">Ver reporte Power BI</a> · <a href="powerbi/Masterplop_Executive.pbix" download>Descargar PBIX</a> · <a href="https://github.com/cesarxbox32/masterplop-analytics-engineering" target="_blank" rel="noopener">Código y metodología</a></footer>`;
}
function draw(data){
 const volume=rec(data,'volume'),ticket=rec(data,'quarterly_ticket'),regional=rec(data,'regional_ticket'),top=rec(data,'top_mcg'),contact=rec(data,'contactless'),cb=rec(data,'cashback')[0],diag=rec(data,'cashback_diagnostic');
 const categoryLabel=name=>name.replace('Groceries and Supermarkets','Groceries and<br>Supermarkets').replace('Restaurants and Dining','Restaurants and<br>Dining').replace('Travel and Transportation','Travel and<br>Transportation').replace('Apparel and Accessories','Apparel and<br>Accessories');
 const top5=top.slice(0,5),top5Plot=[...top5].reverse();
 Plotly.newPlot('summaryTop',[{type:'bar',orientation:'h',y:top5Plot.map(x=>categoryLabel(x.mcg_name)),x:top5Plot.map(x=>+x.net_spend_share_pct),customdata:top5Plot.map(x=>x.mcg_name),texttemplate:'%{x:.1f}%',textposition:'outside',cliponaxis:false,marker:{color:PURPLE},hovertemplate:'%{customdata}<br>%{x:.2f}% del gasto neto<extra></extra>'}],plotLayout('',{horizontal:true,xSuffix:'%',height:390,showLegend:false,xRange:[0,25]}),PLOT);
 renderTable('summaryTop',[{label:'Categoría',value:'mcg_name'},{label:'Participación',value:x=>fmtPct(x.net_spend_share_pct)},{label:'Monto neto',value:x=>fmtUsd(x.net_spend_usd)}],top5);
 const c5=[...contact].sort((a,b)=>+b.contactless_net_spend_pct-(+a.contactless_net_spend_pct)).slice(0,5),c5Plot=[...c5].reverse();
 Plotly.newPlot('summaryContactless',[{type:'bar',orientation:'h',y:c5Plot.map(x=>x.issuer_country),x:c5Plot.map(x=>+x.contactless_net_spend_pct),texttemplate:'%{x:.1f}%',textposition:'outside',cliponaxis:false,marker:{color:BLUE},hovertemplate:'%{y}<br>%{x:.2f}% del gasto neto<extra></extra>'}],plotLayout('',{horizontal:true,xSuffix:'%',height:390,showLegend:false,xRange:[0,100]}),PLOT);
 renderTable('summaryContactless',[{label:'País emisor',value:'issuer_country'},{label:'Adopción',value:x=>fmtPct(x.contactless_net_spend_pct)},{label:'Gasto contactless',value:x=>fmtUsd(x.contactless_net_spend_usd)}],c5);
 const types=[...new Set(volume.map(x=>x.product_type))];
 Plotly.newPlot('volume',types.map((t,i)=>{const r=volume.filter(x=>x.product_type===t);return {type:'bar',name:t,x:r.map(x=>`${x.period_year} T${x.period_quarter}`),y:r.map(x=>+x.active_cards),texttemplate:'%{y:,.0f}',textposition:'outside',cliponaxis:false,marker:{color:[BLUE,PURPLE][i]},hovertemplate:`${t}<br>%{x}<br>%{y:,.0f} tarjetas<extra></extra>`}}),plotLayout('',{height:420}),PLOT);
 renderTable('volume',[{label:'Período',value:x=>`${x.period_year} T${x.period_quarter}`},{label:'Tipo',value:'product_type'},{label:'Tarjetas activas',value:x=>fmtInt(x.active_cards)},{label:'Transacciones',value:x=>fmtInt(x.transaction_count)}],volume);
 Plotly.newPlot('ticket',[{type:'scatter',mode:'lines+markers+text',x:ticket.map(x=>`${x.period_year} T${x.period_quarter}`),y:ticket.map(x=>+x.net_spend_per_active_card_usd),text:ticket.map(x=>fmtUsd(x.net_spend_per_active_card_usd)),textposition:'top center',line:{color:'#D39A00',width:4},marker:{color:YELLOW,size:13,line:{color:'#8A6500',width:1.5}},hovertext:ticket.map(x=>`${x.period_year} T${x.period_quarter}<br>${fmtUsd(x.net_spend_per_active_card_usd)} por tarjeta`),hovertemplate:'%{hovertext}<extra></extra>'}],plotLayout('',{height:420,yPrefix:'USD ',showLegend:false}),PLOT);
 renderTable('ticket',[{label:'Período',value:x=>`${x.period_year} T${x.period_quarter}`},{label:'Gasto neto',value:x=>fmtUsd(x.net_spend_usd)},{label:'Tarjetas crédito',value:x=>fmtInt(x.active_credit_cards)},{label:'Ticket',value:x=>fmtUsd(x.net_spend_per_active_card_usd)}],ticket);
 const countries=['Todos',...[...new Set(regional.map(x=>x.issuer_country))].sort((a,b)=>a.localeCompare(b,'es'))],products=['Todos',...[...new Set(regional.map(x=>x.product_name))].sort((a,b)=>a.localeCompare(b,'es'))];countryFilter.innerHTML=countries.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');productFilter.innerHTML=products.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');countryFilter.value=countries.includes('Chile')?'Chile':'Todos';
 const drawRegional=()=>{const r=regional.filter(x=>(countryFilter.value==='Todos'||x.issuer_country===countryFilter.value)&&(productFilter.value==='Todos'||x.product_name===productFilter.value));const labels=r.map(x=>countryFilter.value==='Todos'?`${x.issuer_country} · ${x.product_name}`:x.product_name);Plotly.react('regional',[{type:'bar',x:labels,y:r.map(x=>+x.avg_transaction_amount_usd),texttemplate:'USD %{y:,.2f}',textposition:'outside',cliponaxis:false,marker:{color:BLUE},customdata:r.map(x=>[x.issuer_country,x.product_name,x.transaction_count]),hovertemplate:'País emisor: %{customdata[0]}<br>Producto: %{customdata[1]}<br>Promedio: USD %{y:,.2f}<br>%{customdata[2]:,.0f} transacciones<extra></extra>'}],plotLayout('',{height:430,yPrefix:'USD ',showLegend:false}),PLOT);renderTable('regional',[{label:'País emisor',value:'issuer_country'},{label:'Producto',value:'product_name'},{label:'Transacciones',value:x=>fmtInt(x.transaction_count)},{label:'Promedio',value:x=>fmtUsd(x.avg_transaction_amount_usd)}],r)};countryFilter.onchange=drawRegional;productFilter.onchange=drawRegional;drawRegional();

 renderTable('topMcg',[{label:'#',value:'spend_rank'},{label:'Categoría',value:'mcg_name'},{label:'Código MCG',value:'mcg_code_original'},{label:'Participación',value:x=>fmtPct(x.net_spend_share_pct)},{label:'Monto neto',value:x=>fmtUsd(x.net_spend_usd)},{label:'Transacciones',value:x=>fmtInt(x.transaction_count)}],top);
 const cs=[...contact].sort((a,b)=>+a.contactless_net_spend_pct-(+b.contactless_net_spend_pct));
 Plotly.newPlot('contactless',[{type:'bar',orientation:'h',y:cs.map(x=>x.issuer_country),x:cs.map(x=>+x.contactless_net_spend_pct),texttemplate:'%{x:.1f}%',textposition:'outside',cliponaxis:false,marker:{color:BLUE},customdata:cs.map(x=>x.contactless_net_spend_usd),hovertemplate:'%{y}<br>%{x:.2f}% del gasto neto<br>USD %{customdata:,.2f}<extra></extra>'}],plotLayout('',{horizontal:true,xSuffix:'%',height:620,showLegend:false,xRange:[0,100]}),PLOT);
 renderTable('contactless',[{label:'País emisor',value:'issuer_country'},{label:'Adopción',value:x=>fmtPct(x.contactless_net_spend_pct)},{label:'Gasto contactless',value:x=>fmtUsd(x.contactless_net_spend_usd)},{label:'Gasto total',value:x=>fmtUsd(x.total_net_spend_usd)}],[...contact].sort((a,b)=>+b.contactless_net_spend_pct-(+a.contactless_net_spend_pct)));

const resizeVisiblePlots=()=>document.querySelectorAll('.page.active .plot').forEach(el=>{if(el.data)Plotly.Plots.resize(el)});
fetch('data/processed/dashboard/manifest.json').then(r=>{if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json()}).then(data=>{app.innerHTML=shell(data);draw(data);setupMotion();setupScrollProgress();setupHeroSpotlight();const tabs=[...document.querySelectorAll('.tab')];const titles={summary:'Resumen Ejecutivo',transactions:'Análisis Transaccional',campaign:'Campaña Mayo 2024'};const activate=(b,updateHash=true)=>{document.querySelectorAll('.page').forEach(x=>{x.classList.remove('active');x.setAttribute('aria-hidden','true')});tabs.forEach(x=>{x.classList.remove('active');x.setAttribute('aria-selected','false');x.tabIndex=-1});b.classList.add('active');b.setAttribute('aria-selected','true');b.tabIndex=0;const page=document.getElementById(b.dataset.page);page.classList.add('active');page.removeAttribute('aria-hidden');document.title=`Masterplop | ${titles[b.dataset.page]}`;if(updateHash)history.replaceState(null,'',`#${b.dataset.page}`);requestAnimationFrame(()=>{resizeVisiblePlots();revealActivePage(page);window.scrollTo({top:0,behavior:reducedMotion.matches?'auto':'smooth'})})};tabs.forEach((b,index)=>{b.onclick=()=>activate(b);b.onkeydown=e=>{let target=null;if(e.key==='ArrowRight')target=tabs[(index+1)%tabs.length];if(e.key==='ArrowLeft')target=tabs[(index-1+tabs.length)%tabs.length];if(e.key==='Home')target=tabs[0];if(e.key==='End')target=tabs[tabs.length-1];if(target){e.preventDefault();target.focus();activate(target)}}});document.querySelectorAll('.page:not(.active)').forEach(x=>x.setAttribute('aria-hidden','true'));const requested=tabs.find(b=>b.dataset.page===location.hash.slice(1));if(requested)activate(requested,false);if('ResizeObserver' in window)new ResizeObserver(resizeVisiblePlots).observe(app)}).catch(e=>{document.body.classList.remove('motion-ready');app.innerHTML=`<div class="error" role="alert"><strong>No fue posible cargar el dashboard.</strong><br>${esc(e.message)}</div>`});
