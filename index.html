<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Dashboard ejecutivo Masterplop: indicadores transaccionales y campaña de cashback de mayo 2024.">
  <meta name="theme-color" content="#0B1532">
  <title>Masterplop | Analytics</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    :root{--blue:#1A56DB;--yellow:#FBBF24;--purple:#7C3AED;--ink:#172033;--muted:#667085;--bg:#F5F7FB;--surface:#fff}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 90% 0,rgba(124,58,237,.08),transparent 30rem),var(--bg);color:var(--ink);font-family:Inter,Segoe UI,Arial,sans-serif}
    header{position:sticky;top:0;z-index:10;background:rgba(11,21,50,.96);backdrop-filter:blur(10px);box-shadow:0 6px 22px rgba(15,23,42,.18)}
    .nav{max-width:1440px;min-height:88px;margin:auto;padding:.65rem 1.4rem;display:flex;align-items:center;gap:1rem}.brand{display:flex;align-items:center;gap:.75rem;min-width:250px}.nav img{width:72px;background:white;border-radius:12px;padding:.22rem;box-shadow:0 8px 24px rgba(0,0,0,.18)}.brand-copy strong{display:block;color:#fff;font-size:.9rem;letter-spacing:.08em}.brand-copy span{display:block;color:#AFC0E6;font-size:.72rem;margin-top:.15rem}.tabs{display:flex;gap:.35rem;margin-left:auto;flex-wrap:wrap}.tab{border:1px solid transparent;border-radius:999px;padding:.58rem .9rem;background:transparent;color:#DDE7FF;font-weight:750;cursor:pointer;transition:.18s ease}.tab:hover{background:rgba(255,255,255,.08);color:#fff}.tab:focus-visible{outline:3px solid rgba(251,191,36,.65);outline-offset:2px}.tab.active{background:var(--blue);border-color:#6EA0FF;color:white;box-shadow:0 5px 14px rgba(26,86,219,.35)}
    main{max-width:1440px;margin:auto;padding:1.1rem 1.4rem 3rem}.page{display:none}.page.active{display:block}.hero{padding:1.4rem 1.5rem;border:1px solid #DCE7FA;border-radius:22px;background:linear-gradient(120deg,#fff,#EFF5FF 62%,#F6F0FF);box-shadow:0 14px 36px rgba(31,56,118,.08);margin-bottom:1rem}.kicker{color:var(--blue);font-size:.72rem;font-weight:900;letter-spacing:.15em}.hero h1{font-size:clamp(2rem,4vw,3.1rem);letter-spacing:-.05em;margin:.25rem 0}.hero p{color:var(--muted);max-width:830px;margin:0;line-height:1.55}.chips{display:flex;gap:.45rem;margin-top:.8rem;flex-wrap:wrap}.chip{border:1px solid #CFE0FF;background:#F8FAFF;color:var(--blue);border-radius:999px;padding:.35rem .65rem;font-size:.78rem;font-weight:800}
    .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:.8rem;margin:1rem 0}.metric{position:relative;overflow:hidden;background:white;border:1px solid #E3E9F3;border-radius:17px;padding:1rem;min-height:116px;box-shadow:0 8px 22px rgba(16,24,40,.05)}.metric:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--blue)}.metric:nth-child(3n+2):before{background:var(--yellow)}.metric:nth-child(3n):before{background:var(--purple)}.metric label{display:block;color:var(--muted);font-size:.78rem;font-weight:700}.metric strong{display:block;font-size:1.65rem;margin-top:.35rem;letter-spacing:-.04em}.metric small{color:#98A2B3}
    h2{margin:1.6rem 0 .65rem;font-size:1.15rem;letter-spacing:-.01em}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}.chart,.panel{background:white;border:1px solid #E3E8F1;border-radius:18px;padding:.35rem;box-shadow:0 8px 24px rgba(16,24,40,.05);min-width:0;min-height:420px;overflow:hidden}.panel{padding:1rem;min-height:auto}.filters{display:flex;gap:.75rem;flex-wrap:wrap;margin:.8rem 0}.filters label{font-size:.76rem;color:var(--muted);font-weight:750}.filters select{min-width:190px;display:block;margin-top:.3rem;border:1px solid #CCD8EA;border-radius:10px;padding:.58rem .7rem;background:white;color:var(--ink);box-shadow:0 2px 7px rgba(16,24,40,.04)}
    table{width:100%;border-collapse:collapse;font-size:.83rem}th,td{padding:.55rem;border-bottom:1px solid #EDF0F5;text-align:left}th{color:var(--blue);background:#F7FAFF;position:sticky;top:0}.table-wrap{max-height:390px;overflow:auto}.notice{padding:1rem;border-radius:14px;background:#FFFBEB;border:1px solid #FDE68A;color:#5F4700;line-height:1.5}.quality{background:#F0FDF4;border-color:#BBF7D0;color:#166534}.error{margin:3rem auto;max-width:780px;padding:1rem;border:1px solid #FCA5A5;background:#FEF2F2;color:#991B1B;border-radius:12px}
    footer{color:#7C8799;font-size:.75rem;border-top:1px solid #DDE3EC;margin-top:2rem;padding-top:1rem;line-height:1.5}
    @media(max-width:900px){.grid2{grid-template-columns:1fr}.nav{align-items:center}.chart{min-height:390px}}
    @media(max-width:700px){header{position:relative}.nav{padding:.65rem .75rem;display:block}.brand{min-width:0}.nav img{width:58px}.brand-copy strong{font-size:.8rem}.tabs{width:100%;margin:.65rem 0 0;overflow-x:auto;flex-wrap:nowrap;padding-bottom:.18rem;scrollbar-width:thin}.tab{flex:0 0 auto;font-size:.74rem;padding:.5rem .68rem}main{padding:.75rem .7rem 2rem}.hero{padding:1.05rem 1rem;border-radius:17px}.hero h1{font-size:2rem}.hero p{font-size:.9rem}.metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem}.metric{min-height:108px;padding:.82rem}.metric strong{font-size:1.35rem}.chart{min-height:365px;border-radius:15px}.filters{display:grid;grid-template-columns:1fr 1fr}.filters select{min-width:0;width:100%}}
    @media(max-width:440px){.brand-copy span{display:none}.metrics{grid-template-columns:1fr}.filters{grid-template-columns:1fr}.chip{font-size:.7rem}.hero h1{font-size:1.72rem}}
  </style>
</head>
<body>
<header><div class="nav"><div class="brand"><img src="https://raw.githubusercontent.com/cesarxbox32/masterplop-analytics-engineering/main/Masterplop%20logo.png" alt="Logo Masterplop"><div class="brand-copy"><strong>MASTERPLOP</strong><span>Executive Analytics</span></div></div><nav class="tabs" aria-label="Secciones del dashboard"><button class="tab active" data-page="summary" aria-selected="true">Resumen</button><button class="tab" data-page="transactions" aria-selected="false">Análisis transaccional</button><button class="tab" data-page="campaign" aria-selected="false">Campaña mayo 2024</button></nav></div></header>
<main id="app"><div class="panel">Cargando métricas agregadas…</div></main>
<script>
const BLUE='#1A56DB',YELLOW='#FBBF24',PURPLE='#7C3AED',PLOT={responsive:true,displaylogo:false,displayModeBar:false,scrollZoom:false};
const fmtInt=v=>Number(v).toLocaleString('es-CL',{maximumFractionDigits:0});
const fmtUsd=v=>'USD '+Number(v).toLocaleString('es-CL',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtPct=v=>Number(v).toLocaleString('es-CL',{minimumFractionDigits:2,maximumFractionDigits:2})+'%';
const rec=(data,name)=>data.datasets[name].records;
const metric=(label,value,note='')=>`<div class="metric"><label>${label}</label><strong>${value}</strong><small>${note}</small></div>`;
const hero=(title,copy)=>`<section class="hero"><div class="kicker">MASTERPLOP · ANALYTICS</div><h1>${title}</h1><p>${copy}</p><div class="chips"><span class="chip">Enero–junio 2024</span><span class="chip">48/48 controles conciliados</span><span class="chip">Datos agregados · Sin IDs</span></div></section>`;
const plotLayout=(title,{horizontal=false,height=430,xSuffix='',yPrefix='',showLegend=true}={})=>{const mobile=window.innerWidth<700;return {height:mobile?Math.min(height,390):height,title:{text:title,x:.02,xanchor:'left',y:.97,font:{size:mobile?15:17}},paper_bgcolor:'rgba(0,0,0,0)',plot_bgcolor:'rgba(0,0,0,0)',font:{family:'Inter, Segoe UI, sans-serif',color:'#172033',size:mobile?10:12},margin:{l:horizontal?(mobile?125:210):(mobile?50:65),r:horizontal?(mobile?32:54):24,t:82,b:mobile?58:52},showlegend:showLegend,legend:{orientation:'h',x:1,xanchor:'right',y:1.03,yanchor:'bottom',font:{size:11}},hoverlabel:{bgcolor:'white',font:{color:'#172033'}},xaxis:{gridcolor:'#EEF1F6',zeroline:false,automargin:true,ticksuffix:xSuffix},yaxis:{gridcolor:'#EEF1F6',zeroline:false,automargin:true,tickprefix:yPrefix}}};
function shell(data){
 const e=rec(data,'executive')[0], cb=rec(data,'cashback')[0];
 return `<section id="summary" class="page active">${hero('Resumen Ejecutivo','Una lectura ejecutiva de actividad, gasto, adopción tecnológica y costo de campaña sobre datos financieros conciliados.')}
 <div class="metrics">${metric('Tarjetas activas',fmtInt(e.active_cards),'distintas')}${metric('Transacciones',fmtInt(e.transaction_count),'enero–junio')}${metric('Gasto neto',fmtUsd(e.total_net_spend_usd),'incluye ajustes')}${metric('Ticket promedio',fmtUsd(e.avg_transaction_amount_usd),'por transacción')}${metric('Cashback mayo',fmtUsd(e.total_cashback_usd),'costo oficial')}${metric('Tarjetas beneficiadas',fmtInt(e.beneficiary_card_count),'cashback positivo')}</div>
 <h2>Hallazgos relevantes</h2><div class="grid2"><div id="summaryTop" class="chart"></div><div id="summaryContactless" class="chart"></div></div></section>
 <section id="transactions" class="page">${hero('Análisis Transaccional','Los cinco indicadores solicitados, separados por período real, mercado emisor, producto y categoría comercial.')}
 <div class="grid2"><div id="volume" class="chart"></div><div id="ticket" class="chart"></div></div>
 <h2>Ticket regional por país emisor y producto</h2><div class="filters"><label>País emisor<select id="countryFilter"></select></label><label>Producto<select id="productFilter"></select></label></div><div id="regional" class="chart"></div>
 <h2>Comercios y adopción tecnológica</h2><div class="grid2"><div id="topMcg" class="chart"></div><div id="contactless" class="chart"></div></div><p class="notice">El denominador del Top 10 es el gasto neto global e incluye el MCG 35 sin maestro como <strong>Sin clasificar</strong>. El indicador regional utiliza país emisor.</p></section>
 <section id="campaign" class="page">${hero('Campaña Mayo 2024','Crédito · emisor Chile · comercio fuera de Chile · 7% del gasto neto positivo · tope USD 50 por tarjeta.')}
 <div class="metrics">${metric('Costo total',fmtUsd(cb.total_cashback_usd),'redondeo por tarjeta')}${metric('Beneficiadas',fmtInt(cb.beneficiary_card_count),'cashback > 0')}${metric('Tarjetas topadas',fmtInt(cb.capped_card_count),'máximo USD 50')}${metric('Gasto elegible',fmtUsd(cb.net_eligible_spend_usd),'compras menos devoluciones')}${metric('Transacciones elegibles',fmtInt(cb.eligible_transaction_count),'geografía real')}${metric('Ahorro por tope',fmtUsd(cb.cap_savings_usd),'vs. cashback sin límite')}</div>
 <div class="grid2"><div id="campaignScenario" class="chart"></div><div id="campaignDiagnostic" class="chart"></div></div><p class="notice quality"><strong>Decisión financiera:</strong> se agrupa primero por tarjeta, se descuentan devoluciones, se limita a USD 50 y se redondea individualmente antes de sumar. <code>is_xb</code> se conserva solo como diagnóstico.</p></section>
 <footer><strong>Definiciones:</strong> tarjetas activas = tarjetas distintas con transacción; ticket trimestral = gasto neto de crédito / tarjetas activas de crédito; ticket regional = promedio por transacción según país emisor; contactless = gasto contactless / gasto total. Montos en USD. Fuente: enero–junio 2024. · <a href="https://github.com/cesarxbox32/masterplop-analytics-engineering" target="_blank" rel="noopener">Código y metodología</a></footer>`;
}
function draw(data){
 const volume=rec(data,'volume'),ticket=rec(data,'quarterly_ticket'),regional=rec(data,'regional_ticket'),top=rec(data,'top_mcg'),contact=rec(data,'contactless'),cb=rec(data,'cashback')[0],sens=rec(data,'cashback_sensitivity')[0],wrong=rec(data,'cashback_is_xb')[0],diag=rec(data,'cashback_diagnostic');
 Plotly.newPlot('summaryTop',[{type:'bar',orientation:'h',y:top.slice(0,5).map(x=>x.mcg_name).reverse(),x:top.slice(0,5).map(x=>+x.net_spend_share_pct).reverse(),texttemplate:'%{x:.1f}%',textposition:'outside',cliponaxis:false,marker:{color:PURPLE},hovertemplate:'%{y}<br>%{x:.2f}%<extra></extra>'}],plotLayout('Top 5 MCG por participación',{horizontal:true,xSuffix:'%',height:410,showLegend:false}),PLOT);
 const c5=[...contact].sort((a,b)=>b.contactless_net_spend_pct-a.contactless_net_spend_pct).slice(0,5).reverse();Plotly.newPlot('summaryContactless',[{type:'bar',orientation:'h',y:c5.map(x=>x.issuer_country),x:c5.map(x=>+x.contactless_net_spend_pct),texttemplate:'%{x:.1f}%',textposition:'outside',cliponaxis:false,marker:{color:BLUE},hovertemplate:'%{y}<br>%{x:.2f}%<extra></extra>'}],plotLayout('Top 5 países contactless',{horizontal:true,xSuffix:'%',height:410,showLegend:false}),PLOT);
 const types=[...new Set(volume.map(x=>x.product_type))];Plotly.newPlot('volume',types.map((t,i)=>({type:'bar',name:t,x:volume.filter(x=>x.product_type===t).map(x=>`${x.period_year} T${x.period_quarter}`),y:volume.filter(x=>x.product_type===t).map(x=>+x.active_cards),texttemplate:'%{y:,.0f}',textposition:'outside',cliponaxis:false,marker:{color:[BLUE,PURPLE][i]}})),plotLayout('Tarjetas distintas por trimestre y tipo',{height:430}),PLOT);
 Plotly.newPlot('ticket',[{type:'bar',x:ticket.map(x=>`${x.period_year} T${x.period_quarter}`),y:ticket.map(x=>+x.net_spend_per_active_card_usd),texttemplate:'USD %{y:,.2f}',textposition:'outside',cliponaxis:false,marker:{color:YELLOW,line:{color:'#D89A00',width:1}},hovertemplate:'%{x}<br>USD %{y:,.2f}<extra></extra>'}],plotLayout('Ticket trimestral de crédito',{height:430,yPrefix:'USD ',showLegend:false}),PLOT);
 const countries=['Todos',...[...new Set(regional.map(x=>x.issuer_country))].sort((a,b)=>a.localeCompare(b,'es'))],products=['Todos',...[...new Set(regional.map(x=>x.product_name))].sort((a,b)=>a.localeCompare(b,'es'))];countryFilter.innerHTML=countries.map(x=>`<option>${x}</option>`).join('');productFilter.innerHTML=products.map(x=>`<option>${x}</option>`).join('');countryFilter.value=countries.includes('Chile')?'Chile':'Todos';
 const drawRegional=()=>{let r=regional.filter(x=>(countryFilter.value==='Todos'||x.issuer_country===countryFilter.value)&&(productFilter.value==='Todos'||x.product_name===productFilter.value));const labels=r.map(x=>countryFilter.value==='Todos'?`${x.issuer_country} · ${x.product_name}`:x.product_name);Plotly.react('regional',[{type:'bar',x:labels,y:r.map(x=>+x.avg_transaction_amount_usd),texttemplate:'USD %{y:,.2f}',textposition:'outside',cliponaxis:false,marker:{color:r.map((_,i)=>[BLUE,PURPLE,YELLOW][i%3])},hovertemplate:'%{x}<br>Promedio: USD %{y:,.2f}<extra></extra>'}],plotLayout('Promedio por transacción · mercado emisor',{height:450,yPrefix:'USD ',showLegend:false}),PLOT)};countryFilter.onchange=drawRegional;productFilter.onchange=drawRegional;drawRegional();
 Plotly.newPlot('topMcg',[{type:'bar',orientation:'h',y:top.map(x=>x.mcg_name).reverse(),x:top.map(x=>+x.net_spend_share_pct).reverse(),texttemplate:'%{x:.2f}%',textposition:'outside',cliponaxis:false,customdata:top.map(x=>[x.net_spend_usd,x.transaction_count]).reverse(),marker:{color:PURPLE},hovertemplate:'%{y}<br>%{x:.2f}%<br>USD %{customdata[0]:,.2f}<br>%{customdata[1]:,.0f} transacciones<extra></extra>'}],plotLayout('Top 10 MCG · participación global',{horizontal:true,xSuffix:'%',height:520,showLegend:false}),PLOT);
 const cs=[...contact].sort((a,b)=>a.contactless_net_spend_pct-b.contactless_net_spend_pct);Plotly.newPlot('contactless',[{type:'bar',orientation:'h',y:cs.map(x=>x.issuer_country),x:cs.map(x=>+x.contactless_net_spend_pct),texttemplate:'%{x:.1f}%',textposition:'outside',cliponaxis:false,marker:{color:BLUE},hovertemplate:'%{y}<br>%{x:.2f}%<extra></extra>'}],plotLayout('Adopción contactless por país emisor',{horizontal:true,xSuffix:'%',height:520,showLegend:false}),PLOT);
 Plotly.newPlot('campaignScenario',[{type:'bar',x:['Oficial neto','Sin devoluciones','is_xb incorrecto'],y:[+cb.total_cashback_usd,+sens.positive_only_cashback_usd,+wrong.incorrect_is_xb_cashback_usd],texttemplate:'USD %{y:,.2f}',textposition:'outside',cliponaxis:false,marker:{color:[BLUE,YELLOW,'#EF4444']},hovertemplate:'%{x}<br>USD %{y:,.2f}<extra></extra>'}],plotLayout('Sensibilidad del costo de campaña',{height:430,yPrefix:'USD ',showLegend:false}),PLOT);
 const diagSorted=[...diag].sort((a,b)=>a.transaction_count-b.transaction_count);Plotly.newPlot('campaignDiagnostic',[{type:'bar',orientation:'h',y:diagSorted.map(x=>x.diagnostic_status),x:diagSorted.map(x=>+x.transaction_count),texttemplate:'%{x:,.0f}',textposition:'outside',cliponaxis:false,marker:{color:[BLUE,PURPLE,YELLOW,'#EF4444']},hovertemplate:'%{y}<br>%{x:,.0f} transacciones<extra></extra>'}],plotLayout('Diagnóstico de elegibilidad vs. is_xb',{horizontal:true,height:430,showLegend:false}),PLOT);
}
fetch('data/processed/dashboard/manifest.json').then(r=>{if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json()}).then(data=>{app.innerHTML=shell(data);draw(data);document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.page').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected','false'));b.classList.add('active');b.setAttribute('aria-selected','true');document.getElementById(b.dataset.page).classList.add('active');window.dispatchEvent(new Event('resize'))})}).catch(e=>{app.innerHTML=`<div class="error"><strong>No fue posible cargar el dashboard.</strong><br>${e.message}</div>`});
  </script>
</body>
</html>
